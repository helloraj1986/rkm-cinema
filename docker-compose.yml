# ============================================================================
# RKM Cinema — bundled self-contained stack (EXPERIMENT branch)
# ============================================================================
# One compose file for the whole pipeline. The media path + ports are
# substituted from the repo-level `.env` (copy `.env.example` and fill it in),
# so there is ONE config source — no rkm.config.toml.
#
#   ./bootstrap.sh    (or .\bootstrap.ps1)  renders config + provisions
#
# Default profile  = api + web + jellyfin + (provisioner run as a one-shot)
# fullstack profile = + radarr + sonarr + prowlarr + qbittorrent
#
# Isolation from the prod stack: this project uses its OWN network (rkm-exp),
# its own ./data volume and non-colliding ports, so it cannot touch the
# production RKM/Plex/*arr containers.
# ============================================================================

# The single data root, a scalar volume string mounted at the SAME container
# path /data in every service that touches media => Jellyfin, Sonarr, Radarr +
# qBittorrent all see identical paths (hardlinks + imports + scanning just work).
# (Must be a STRING anchor — `- *media` inside a volumes LIST cannot splice a
# nested list; Compose requires each volume item to be a string.)
x-media: &media "${RKM_MEDIA_PATH:-./data}:/data"

# EXTRA media roots — a second (or third) physical drive. Movies on one drive,
# TV on another is normal, and a container can only see what is bind-mounted, so
# RKM_MEDIA_PATH_2 -> /media2 (RKM_MEDIA_PATH_3 -> /media3). Declare them in
# .env and MEDIA_LIBRARY_N_PATH may then use host paths from ANY of them.
# Unset → the extra mount points back at ./data; the provisioner ignores an
# undeclared root, so no library is ever discovered twice.
x-media2: &media2 "${RKM_MEDIA_PATH_2:-./data}:/media2"
x-media3: &media3 "${RKM_MEDIA_PATH_3:-./data}:/media3"

x-lsio: &lsio
  # Common linuxserver env for *arr containers (host user map).
  environment:
    PUID: "${RKM_PUID:-1000}"
    PGID: "${RKM_PGID:-1000}"
    TZ: "${RKM_TIMEZONE:-Australia/Melbourne}"

services:
  # --- RKM Cinema API (FastAPI): holds all secrets + orchestrates ---
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rkm-bundled-api:latest
    restart: unless-stopped
    env_file:
      - .rkm.env
    environment:
      RKM_RUNTIME_PATH: /shared/runtime.json
      # Auth guard (AUTH_MULTIUSER_PLAN). Compose reads the repo `.env` for
      # interpolation, so this value can be flipped and applied by RECREATING the api
      # alone — no render, and above all no provisioner run (which would cancel an
      # in-flight library scan). `.rkm.env` also carries the key for the rendered
      # path; this override exists so the documented lockout recovery is a real
      # one-command escape hatch rather than a claim that only holds after a deploy.
      RKM_AUTH_REQUIRED: "${RKM_AUTH_REQUIRED:-false}"
    volumes:
      - rkm_shared:/shared
      - *media
      - *media2
      - *media3
    networks:
      - rkm-exp
    depends_on:
      - jellyfin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Web UI (nginx) + reverse proxy /api -> api:8000 on one origin ---
  # Phase 4: multi-stage build compiles the React shell (frontend/Dockerfile: node ->
  # nginx, dist baked in). API keys never reach the client — /api proxies to the
  # api container.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rkm-bundled-web:latest
    container_name: rkm-bundled-web
    restart: unless-stopped
    ports:
      - "${RKM_DASHBOARD_PORT:-8124}:80"
    depends_on:
      - api
    networks:
      - rkm-exp

  # --- Jellyfin media server (the bundled backend) ---
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: rkm-bundled-jellyfin
    restart: unless-stopped
    ports:
      - "${RKM_JELLYFIN_PORT:-8098}:8096"
      - "8098/udp"        # client discovery (UDP, host port optional)
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - *media
      - *media2
      - *media3
    environment:
      TZ: "${RKM_TIMEZONE:-Australia/Melbourne}"
      # Optional Intel QSV / AMD VAAPI hardware transcoding (free on Jellyfin).
      # Uncomment if /dev/dri is present:
      # JELLYFIN_FFMPEG_OPTS: ""
    # devices:
    #   - /dev/dri:/dev/dri
    networks:
      - rkm-exp

  # ================= Full download pipeline (opt-in) =====================
  # radarr / sonarr / prowlarr / qbittorrent are gated behind the `fullstack`
  # profile. The first experiment step only needs api+web+jellyfin.
  # =========================================================================
  radarr:
    profiles: ["fullstack"]
    image: linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - "7879:7878"
    volumes:
      - radarr-config:/config
      - *media
      - *media2
      - *media3
      - ${RKM_MEDIA_PATH:-./data}/downloads:/data/downloads
    <<: *lsio
    networks:
      - rkm-exp

  sonarr:
    profiles: ["fullstack"]
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
      - "8988:8989"
    volumes:
      - sonarr-config:/config
      - *media
      - *media2
      - *media3
    <<: *lsio
    networks:
      - rkm-exp

  prowlarr:
    profiles: ["fullstack"]
    image: linuxserver/prowlarr:latest
    restart: unless-stopped
    ports:
      - "9697:9696"
    volumes:
      - prowlarr-config:/config
    <<: *lsio
    networks:
      - rkm-exp

  qbittorrent:
    profiles: ["fullstack"]
    image: qbittorrentofficial/qbittorrent-nox:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "${QBT_TORRENT_PORT:-6881}:6881"
      - "${QBT_TORRENT_PORT:-6881}:6881/udp"
    volumes:
      - qbit-config:/config
      - ${RKM_MEDIA_PATH:-./data}/downloads:/data/downloads
      - /etc/localtime:/etc/localtime:ro
    environment:
      QBT_LEGAL_NOTICE: ok
      QBT_WEBUI_PORT: 8080
      QBT_TORRENTING_PORT: "${QBT_TORRENT_PORT:-6881}"
      QBT_SAVE_PATH: /data/downloads
    networks:
      - rkm-exp

  # --- One-shot provisioner: wires Jellyfin + (fullstack) *arr automatically --
  provisioner:
    build:
      # Context = ./backend so the image can COPY the SHARED config parser
      # (config/media_libraries.py) — one source of truth for MEDIA_LIBRARY_*.
      context: ./backend
      dockerfile: provisioner/Dockerfile
    image: rkm-bundled-provisioner:latest
    restart: "no"
    profiles: ["provision"]
    volumes:
      - rkm_shared:/shared
      - *media
      - *media2
      - *media3
    environment:
      JELLYFIN_URL: "http://jellyfin:8096"
      JELLYFIN_ADMIN_USER: "${RKM_JELLYFIN_ADMIN_USER:-admin}"
      JELLYFIN_ADMIN_PASSWORD: "${RKM_JELLYFIN_ADMIN_PASSWORD:?set JELLYFIN_ADMIN_PASSWORD in the repo .env (render_config auto-generates it on first run)}"
      JELLYFIN_BROWSER_URL: "${RKM_JELLYFIN_BROWSER:-http://localhost:8098}"
      TZ: "${RKM_TIMEZONE:-Australia/Melbourne}"
      # Media libraries (MEDIA_LIBRARIES_PLAN): the provisioner wires every
      # configured entry into Jellyfin. Compose cannot enumerate arbitrary N,
      # so the rendered .rkm.env (which carries MEDIA_LIBRARY_* +
      # RKM_MEDIA_PATH + RKM_MEDIA_PATH_2/3) is passed and the shared parser
      # picks out the keys. The media roots are ALSO set here explicitly: .rkm.env
      # is only as fresh as the last render, and an asymmetric env (provisioner
      # translating D: paths while the api cannot) is exactly how a library ends
      # up wired in one place and invisible in the other.
      RKM_MEDIA_PATH: "${RKM_MEDIA_PATH:-./data}"
      RKM_MEDIA_PATH_2: "${RKM_MEDIA_PATH_2:-}"
      RKM_MEDIA_PATH_3: "${RKM_MEDIA_PATH_3:-}"
    env_file:
      - .rkm.env
    depends_on:
      - jellyfin
    networks:
      - rkm-exp

volumes:
  rkm_shared: {}
  jellyfin-config: {}
  jellyfin-cache: {}
  radarr-config: {}
  sonarr-config: {}
  prowlarr-config: {}
  qbit-config: {}

networks:
  rkm-exp:
    driver: bridge