services:
  # --- RKM Cinema API (FastAPI): holds all *arr / TMDB / Plex secrets server-side ---
  api:
    build: .
    image: rkm-cinema-api:latest
    container_name: rkm-cinema-api
    restart: unless-stopped
    env_file:
      # Canonical secrets live at the workspace root (D:\hermes_agent\hermes-workspace\.env).
      # media/.env is a WSL symlink to it — Docker Desktop CANNOT follow WSL symlinks,
      # so point env_file at the real file (../../.env from this compose dir).
      - ../../.env
    expose:
      - "8000"
    volumes:
      # Writable DIRECTORY mount so the API can persist to the LIVE host
      # watchlist.json. A single-file `:ro` mount here was the bug: (1) it can't
      # be `os.replace`d (repo saves are atomic tmp+replace), so the refresh
      # job's writes failed silently; (2) on Docker Desktop a single-file bind
      # mount pins the file's ORIGINAL inode, so the container kept reading a
      # stale 17-entry copy even after the host cron grew it to 33.
      # With the dir mounted at /workspace/media (repo's native fallback path),
      # JsonWatchlistRepository uses /workspace/media/watchlist.json (live +
      # writable) and rebuild_dashboard.py lands on the served files.
      # Compose lives in projects/rkm-cinema, so the data dir is ../../media
      # (i.e. /workspace/media), NOT ../ which would resolve to /workspace/projects.
      - ../../media:/workspace/media:rw
    networks:
      - rkm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Static web UI (nginx) + reverse proxy to the API on the same origin ---
  web:
    image: nginx:alpine
    container_name: rkm-cinema
    restart: unless-stopped
    ports:
      - "0.0.0.0:8123:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - rkm

networks:
  rkm:
    driver: bridge