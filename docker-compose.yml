# ============================================================================
# RKM Cinema — bundled self-contained stack (EXPERIMENT branch)
# ============================================================================
# One compose file for the whole pipeline. The media path + ports are
# substituted from the `.env` written by `render_config.py` (from
# rkm.config.toml), so there is ONE config source.
#
#   ./bootstrap.sh    (or .\bootstrap.ps1)  renders config + provisions
#
# Default profile  = api + web + jellyfin + (provisioner run as a one-shot)
# fullstack profile = + radarr + sonarr + prowlarr + qbittorrent
#
# Isolation from the prod stack: this project uses its OWN network (rkm-exp),
# its own ./data volume and non-colliding ports, so it cannot touch the
# production RKM/Plex/*arr containers.
# ============================================================================

x-media: &media
  # The single data root, mounted at the SAME container path /data in every
  # service that touches media => Jellyfin, Sonarr, Radarr + qBittorrent all
  # see identical paths (hardlinks + imports + scanning just work).
  - "${RKM_MEDIA_PATH:-./data}:/data"

x-lsio: &lsio
  # Common linuxserver env for *arr containers (host user map).
  environment:
    PUID: "${RKM_PUID:-1000}"
    PGID: "${RKM_PGID:-1000}"
    TZ: "${RKM_TIMEZONE:-Australia/Melbourne}"

services:
  # --- RKM Cinema API (FastAPI): holds all secrets + orchestrates ---
  api:
    build: .
    image: rkm-bundled-api:latest
    restart: unless-stopped
    env_file:
      - .rkm.env
    environment:
      RKM_RUNTIME_PATH: /shared/runtime.json
    volumes:
      - rkm_shared:/shared
      - *media
    networks:
      - rkm-exp
    depends_on:
      - jellyfin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --- Static web UI (nginx) + reverse proxy /api -> api:8000 on one origin ---
  web:
    image: nginx:alpine
    container_name: rkm-bundled-web
    restart: unless-stopped
    ports:
      - "${RKM_DASHBOARD_PORT:-8124}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - rkm-exp

  # --- Jellyfin media server (the bundled backend) ---
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: rkm-bundled-jellyfin
    restart: unless-stopped
    ports:
      - "${RKM_JELLYFIN_PORT:-8098}:8096"
      - "8098/udp"        # client discovery (UDP, host port optional)
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - *media
    environment:
      TZ: "${RKM_TIMEZONE:-Australia/Melbourne}"
      # Optional Intel QSV / AMD VAAPI hardware transcoding (free on Jellyfin).
      # Uncomment if /dev/dri is present:
      # JELLYFIN_FFMPEG_OPTS: ""
    # devices:
    #   - /dev/dri:/dev/dri
    networks:
      - rkm-exp

  # ================= Full download pipeline (opt-in) =====================
  # radarr / sonarr / prowlarr / qbittorrent are gated behind the `fullstack`
  # profile. The first experiment step only needs api+web+jellyfin.
  # =========================================================================
  radarr:
    profiles: ["fullstack"]
    image: linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - "7879:7878"
    volumes:
      - radarr-config:/config
      - *media
      - ${RKM_MEDIA_PATH:-./data}/downloads:/data/downloads
    <<: *lsio
    networks:
      - rkm-exp

  sonarr:
    profiles: ["fullstack"]
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
      - "8988:8989"
    volumes:
      - sonarr-config:/config
      - *media
    <<: *lsio
    networks:
      - rkm-exp

  prowlarr:
    profiles: ["fullstack"]
    image: linuxserver/prowlarr:latest
    restart: unless-stopped
    ports:
      - "9697:9696"
    volumes:
      - prowlarr-config:/config
    <<: *lsio
    networks:
      - rkm-exp

  qbittorrent:
    profiles: ["fullstack"]
    image: qbittorrentofficial/qbittorrent-nox:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "${QBT_TORRENT_PORT:-6881}:6881"
      - "${QBT_TORRENT_PORT:-6881}:6881/udp"
    volumes:
      - qbit-config:/config
      - ${RKM_MEDIA_PATH:-./data}/downloads:/data/downloads
      - /etc/localtime:/etc/localtime:ro
    environment:
      QBT_LEGAL_NOTICE: ok
      QBT_WEBUI_PORT: 8080
      QBT_TORRENTING_PORT: "${QBT_TORRENT_PORT:-6881}"
      QBT_SAVE_PATH: /data/downloads
    networks:
      - rkm-exp

  # --- One-shot provisioner: wires Jellyfin + (fullstack) *arr automatically --
  provisioner:
    build: ./provisioner
    image: rkm-bundled-provisioner:latest
    restart: "no"
    profiles: ["provision"]
    volumes:
      - rkm_shared:/shared
      - *media
    environment:
      JELLYFIN_URL: "http://jellyfin:8096"
      JELLYFIN_ADMIN_USER: "${RKM_JELLYFIN_ADMIN_USER:-admin}"
      JELLYFIN_ADMIN_PASSWORD: "${RKM_JELLYFIN_ADMIN_PASSWORD:?set jellyfin_admin_password in rkm.config.toml}"
      JELLYFIN_BROWSER_URL: "${RKM_JELLYFIN_BROWSER:-http://localhost:8098}"
      TZ: "${RKM_TIMEZONE:-Australia/Melbourne}"
    depends_on:
      - jellyfin
    networks:
      - rkm-exp

volumes:
  rkm_shared: {}
  jellyfin-config: {}
  jellyfin-cache: {}
  radarr-config: {}
  sonarr-config: {}
  prowlarr-config: {}
  qbit-config: {}

networks:
  rkm-exp:
    driver: bridge