# Phase 4: nginx serves the React shell (web/dist baked into the image) as the
# origin, keeps the /api reverse-proxy, and preserves the LEGACY app under
# /legacy/* (mounted repo root at /legacy-source) so no ported view is lost.
server {
    listen 80;
    server_name _;

    # React shell document root (from web/Dockerfile build stage).
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — no-cache, server index.html for client-side routes.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # API: reverse-proxy to the FastAPI container (same origin, keys stay server-side).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # Recoverable legacy app (repo root mounted r/o at /legacy-source). Any view
    # not yet ported (discover/watchlist/search/suggest) lives here until Parity.
    location = /legacy {
        return 301 /legacy/;
    }
    location /legacy/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        alias /legacy-source/;
        try_files $uri $uri/ /legacy-source/index.html;
    }
}