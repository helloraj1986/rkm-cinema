server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dashboard + data are regenerated by the cron / build_dashboard.py — never cache them.
    location ~* \.(html?|json|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # API: reverse-proxy to the FastAPI container (keeps the browser on one origin,
    # so API keys never touch the client). Secrets live in the api container's env.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}
