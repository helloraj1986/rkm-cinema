# nginx serves the React shell (baked into the image from frontend/Dockerfile)
# as the origin and reverse-proxies /api to the FastAPI container. API keys
# never reach the client.
server {
    listen 80;
    server_name _;

    # React shell document root (from frontend/Dockerfile build stage).
    root /usr/share/nginx/html;
    index index.html;

    # ⚠⚠ COMPRESSION IS ON, AND IT IS NOT A MICRO-OPTIMISATION HERE. The shell's JS was
    # measured at 1,074,168 B UNCOMPRESSED against the live stack (2026-09-14) — for a
    # bundle Vite reports as ~328 kB gzipped — and this file had no `gzip` at all, so a
    # phone on the tailnet pulled the whole megabyte on every launch.
    # ⚠ `gzip_types` is a WHITELIST (text/html is always compressed implicitly), and that
    # is the safety property everything here rests on: MEDIA IS NOT IN IT, so the stream
    # proxy's video/mp4 and video/mp2t responses are never compressed — gzipping a video
    # would burn CPU on both ends and save nothing.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Level 5, not the default 1: the bundle is compressed once per cache miss (see
    # `/assets/` below — a year of immutable), so the extra CPU is paid once and the
    # bytes are paid on every cold launch.
    gzip_comp_level 5;
    # ⚠ `Vary: Accept-Encoding` belongs on every compressible response, or a shared cache
    # can hand a gzipped body to a client that never asked for one.
    gzip_vary on;
    # The client here talks to nginx directly, so it is not a "proxied" request — set
    # anyway: it costs nothing, and it keeps compression working if anything ever fronts
    # this stack and sets X-Forwarded-For (tailscale serve, another reverse proxy).
    gzip_proxied any;
    # ⚠⚠ DELIBERATELY ABSENT: `gzip_static on`. It would serve a pre-built `.gz` instead of
    # compressing per request — but the Vite build emits NO `.gz` files (verified 2026-09-14:
    # frontend/dist/assets/ holds only the .js and the .css), so the directive would be inert
    # today, AND whether nginx:alpine is compiled with --with-http_gzip_static_module cannot be
    # verified from here (no docker daemon in the sandbox). An unknown directive makes nginx
    # REFUSE TO START, i.e. it would take the whole web container down for no gain at all.
    # Add it only in the same change as a build step that emits the .gz files, and test that
    # build — never on its own.

    # React SPA — revalidate every time, but let the document be STORED.
    # ⚠ The header used to be `no-store, no-cache, must-revalidate, max-age=0`. `no-store`
    # FORBIDS keeping the document at all, so even a repeat launch re-downloaded the shell
    # and an offline launch was impossible by construction. `no-cache` still guarantees
    # freshness — the browser revalidates against nginx's ETag and gets a 304 of ~200 bytes
    # instead of the document — while allowing the store.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite's bundle names carry a content hash, so a given URL is immutable by construction:
    # cache it for a year and never ask again. ⚠ nginx does NOT inherit `add_header` into a
    # location that defines one, so the policy is stated here in full.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # ⚠ `=404`, NOT the SPA fallback: a missing bundle must fail loudly. Answering
        # index.html (200, text/html) for a `.js` request is reported by the browser as a
        # SYNTAX ERROR, which sends the next debugging session looking at the bundle instead
        # of at the deploy. (`/` is `no-cache`, so the document that names the bundle is always
        # revalidated first — the window for hitting this is a deploy in flight.)
        try_files $uri =404;
    }

    # API: reverse-proxy to the FastAPI container (same origin, keys stay server-side).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Dynamic API state (library lists, watchlist, playback facts) must never
        # be cached — a stale row is worse than a slow one.
        add_header Cache-Control "no-store";

        # ...EXCEPT artwork. A poster is immutable for a given (item id, kind,
        # width), so caching it is free correctness-wise; stamping no-store on it
        # made the browser re-download every poster on every navigation (~13 MB
        # for a 140-title folder, straight through the api to Jellyfin).
        # A nested location gets its OWN add_header set — nginx does not inherit
        # add_header into a level that defines one — so the artwork policy
        # replaces no-store here, and hides the api's copy so exactly one
        # Cache-Control header is sent. Keep this value in sync with
        # ARTWORK_CACHE_CONTROL in backend/api/routes/jellyfin_poster.py (which
        # covers dev and any non-nginx proxy).
        location ~ ^/api/jellyfin/(poster|person|backdrop)$ {
            # proxy_pass is NOT inherited into a nested location — spell it out
            # (no URI part, so the original path + query string pass through).
            proxy_pass http://api:8000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800";
        }
    }

    # The api's OWN contract, for tools/check_deployed.py ("is the running api this folder's code?").
    # ⚠ Without this rule the SPA fallback above answers index.html for /openapi.json, so the tool
    # parses HTML as JSON and reports "Expecting value: line 1 column 1" — blaming the api for the
    # proxy's answer (measured 2026-09-13). Exposed deliberately: the contract is already committed
    # to the repo (docs/api/openapi.v1.json, ADR-0001) and carries no secrets.
    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
}
