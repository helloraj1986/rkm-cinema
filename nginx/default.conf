# nginx serves the React shell (baked into the image from frontend/Dockerfile)
# as the origin and reverse-proxies /api to the FastAPI container. API keys
# never reach the client.
server {
    listen 80;
    server_name _;

    # React shell document root (from frontend/Dockerfile build stage).
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — no-cache, server index.html for client-side routes.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # API: reverse-proxy to the FastAPI container (same origin, keys stay server-side).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Dynamic API state (library lists, watchlist, playback facts) must never
        # be cached — a stale row is worse than a slow one.
        add_header Cache-Control "no-store";

        # ...EXCEPT artwork. A poster is immutable for a given (item id, kind,
        # width), so caching it is free correctness-wise; stamping no-store on it
        # made the browser re-download every poster on every navigation (~13 MB
        # for a 140-title folder, straight through the api to Jellyfin).
        # A nested location gets its OWN add_header set — nginx does not inherit
        # add_header into a level that defines one — so the artwork policy
        # replaces no-store here, and hides the api's copy so exactly one
        # Cache-Control header is sent. Keep this value in sync with
        # ARTWORK_CACHE_CONTROL in backend/api/routes/jellyfin_poster.py (which
        # covers dev and any non-nginx proxy).
        location ~ ^/api/jellyfin/(poster|person|backdrop)$ {
            # proxy_pass is NOT inherited into a nested location — spell it out
            # (no URI part, so the original path + query string pass through).
            proxy_pass http://api:8000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800";
        }
    }
}
