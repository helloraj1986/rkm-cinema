<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RKM Cinema — tvOS 26 Concept</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root{
    --bg: #08080A;
    --bg-elevated: #1B1B1E;
    --bg-card: #17171A;
    --glass: rgba(24,24,27,0.66);
    --glass-strong: rgba(14,14,16,0.86);
    --hairline: rgba(255,255,255,0.09);
    --text-1: #F5F5F7;
    --text-2: #ABABB2;
    --text-3: #75757C;
    --gold: #F2B93A;
    --gold-bright: #FFD873;
    --gold-dim: #8A6A22;
    --focus-ring: rgba(255,255,255,0.85);
    --danger: #FF6B5E;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#08080A; --bg-elevated:#1B1B1E; --text-1:#F5F5F7; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: #000;
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- TV frame / responsive 16:9 stage ---------- */
  .stage{
    width: min(100%, 177.78vh);
    max-width: 1400px;
  }
  .tv-frame{
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: clamp(10px, 1.2vw, 22px);
    background: #000;
    box-shadow:
      0 40px 90px -20px rgba(0,0,0,.8),
      0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    container-type: inline-size;
  }
  .tv-screen{
    --u: 1cqw; /* 1% of screen width — all sizing below derives from this */
    position:absolute; inset:0;
    background: var(--bg);
    overflow: hidden;
  }

  .hint{
    margin-top: 16px;
    color: var(--text-3);
    font-size: 13px;
    text-align: center;
    letter-spacing: .01em;
  }
  .hint kbd{
    background: var(--bg-elevated);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    color: var(--text-2);
  }

  /* ---------- Screens ---------- */
  .screen{
    position:absolute; inset:0;
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .45s ease;
  }
  .screen.is-active{ opacity:1; visibility:visible; pointer-events:auto; }

  /* ---------- Focusable base ---------- */
  .focusable{ outline:none; }
  .focus-row{ display:flex; }

  /* =========================================================
     SCREEN 1 — PROFILE SWITCHER ("Who's watching?")
     ========================================================= */
  .screen-profiles{
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(60,50,20,.35), transparent 55%),
      radial-gradient(90% 70% at 50% 100%, rgba(10,10,14,1), #000 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: calc(var(--u)*4) calc(var(--u)*6);
    text-align:center;
  }
  .profiles-eyebrow{
    color: var(--text-2);
    font-size: calc(var(--u)*1.05);
    letter-spacing:.02em;
    margin: 0 0 calc(var(--u)*0.6);
  }
  .profiles-title{
    font-size: calc(var(--u)*4.4);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 calc(var(--u)*3.2);
  }
  .profile-row{
    gap: calc(var(--u)*2.6);
    justify-content:center;
    margin-bottom: calc(var(--u)*3);
  }
  .profile-tile{
    background:none; border:none; color:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center;
    width: calc(var(--u)*13);
    padding: calc(var(--u)*0.8);
    border-radius: calc(var(--u)*1.2);
    transition: transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
    opacity:.72;
  }
  .profile-tile .avatar{
    width: calc(var(--u)*10.4);
    height: calc(var(--u)*10.4);
    border-radius: 50%;
    background: linear-gradient(160deg,#2A2A2E,#161618);
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--u)*3.4);
    font-weight:700;
    color: var(--gold-bright);
    position:relative;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    transition: box-shadow .28s ease;
  }
  .profile-tile .lock{
    position:absolute; right:-2%; bottom:-2%;
    width: calc(var(--u)*2.2); height: calc(var(--u)*2.2);
    border-radius:50%;
    background: var(--bg-elevated);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 calc(var(--u)*0.22) #000;
    font-size: calc(var(--u)*1.1);
  }
  .profile-tile .name{
    margin-top: calc(var(--u)*1.1);
    font-size: calc(var(--u)*1.5);
    font-weight:600;
  }
  .profile-tile .sub{
    margin-top: calc(var(--u)*0.25);
    font-size: calc(var(--u)*0.95);
    color: var(--text-2);
  }
  .profile-tile.add .avatar{
    background:transparent;
    border: calc(var(--u)*0.13) dashed var(--hairline);
    color: var(--text-2);
    font-weight:400;
  }
  .profile-tile:focus{ opacity:1; transform: translateY(calc(var(--u)*-0.3)) scale(1.14); }
  .profile-tile:focus .avatar{
    box-shadow: 0 0 0 calc(var(--u)*0.28) var(--focus-ring), 0 calc(var(--u)*1.4) calc(var(--u)*2.6) rgba(0,0,0,.6);
  }

  .profiles-actions{ gap: calc(var(--u)*1.4); justify-content:center; }
  .pill-btn{
    font-family:inherit;
    background: var(--glass);
    border: 1px solid var(--hairline);
    color: var(--text-1);
    padding: calc(var(--u)*0.9) calc(var(--u)*2.1);
    border-radius: calc(var(--u)*2.4);
    font-size: calc(var(--u)*1.05);
    cursor:pointer;
    transition: transform .22s ease, background .22s ease, box-shadow .22s ease;
  }
  .pill-btn:focus{
    transform: scale(1.08);
    background: rgba(255,255,255,.14);
    box-shadow: 0 0 0 calc(var(--u)*0.16) var(--focus-ring);
  }

  /* =========================================================
     SCREEN 2 — HOME
     ========================================================= */
  .screen-home{ display:flex; flex-direction:column; }

  .tv-topbar{
    position:relative; z-index:5;
    display:flex; align-items:center;
    gap: calc(var(--u)*2.2);
    padding: calc(var(--u)*1.7) calc(var(--u)*4.2);
    background: var(--glass-strong);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--hairline);
    transition: opacity .3s ease;
  }
  .tv-topbar.dimmed{ opacity:.55; }
  .brand{
    display:flex; align-items:center; gap: calc(var(--u)*0.6);
    font-weight:800; font-size: calc(var(--u)*1.35);
    letter-spacing:.02em;
    margin-right: calc(var(--u)*1.4);
    white-space:nowrap;
  }
  .brand .dot{ color: var(--gold); }
  .nav-tabs{ display:flex; gap: calc(var(--u)*0.5); flex:1; }
  .nav-tab{
    font-family:inherit;
    background:none; border:none; color: var(--text-2);
    font-size: calc(var(--u)*1.05);
    padding: calc(var(--u)*0.55) calc(var(--u)*1.1);
    border-radius: calc(var(--u)*0.8);
    cursor:pointer;
    transition: transform .2s ease, background .2s ease, color .2s ease;
  }
  .nav-tab[aria-current="true"]{ color: var(--text-1); font-weight:600; }
  .nav-tab:focus{
    color:#111; background: var(--gold);
    transform: scale(1.08);
    box-shadow: 0 0 0 calc(var(--u)*0.16) var(--focus-ring);
  }
  .top-actions{ display:flex; gap: calc(var(--u)*0.8); align-items:center; }
  .icon-btn{
    width: calc(var(--u)*2.6); height: calc(var(--u)*2.6);
    border-radius:50%;
    background: rgba(255,255,255,.06);
    border:none; color: var(--text-1);
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--u)*1.15);
    cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .icon-btn.avatar-btn{
    background: linear-gradient(160deg,#2A2A2E,#161618);
    color: var(--gold-bright); font-weight:700; font-size: calc(var(--u)*1.05);
  }
  .icon-btn:focus{ transform: scale(1.16); box-shadow: 0 0 0 calc(var(--u)*0.16) var(--focus-ring); }

  .tv-content{
    position:relative; flex:1; overflow:hidden;
  }
  .tv-scroll{
    position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    padding-bottom: calc(var(--u)*3);
    scrollbar-width:none;
  }
  .tv-scroll::-webkit-scrollbar{ display:none; }

  .hero{
    position:relative;
    height: calc(var(--u)*32);
    padding: calc(var(--u)*3) calc(var(--u)*4.2) calc(var(--u)*3);
    display:flex; flex-direction:column; justify-content:flex-end;
    background:
      linear-gradient(0deg, var(--bg) 2%, rgba(8,8,10,.15) 55%, rgba(8,8,10,.05) 100%),
      radial-gradient(120% 140% at 20% 20%, #3a2c12 0%, transparent 55%),
      radial-gradient(100% 120% at 80% 0%, #17233a 0%, transparent 60%),
      linear-gradient(135deg,#101014,#1b1b20);
    background-size: 100% 100%, 160% 160%, 160% 160%, 100% 100%;
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{ from{ background-position:0 0,0% 0%,100% 0%,0 0; } to{ background-position:0 0,10% 10%,90% 15%,0 0; } }
  .hero-eyebrow{ color: var(--gold); font-size: calc(var(--u)*1); font-weight:700; margin-bottom: calc(var(--u)*0.5); }
  .hero-title{ font-size: calc(var(--u)*3.6); font-weight:800; margin:0 0 calc(var(--u)*0.6); max-width: 60%; }
  .hero-meta{ color: var(--text-2); font-size: calc(var(--u)*1.05); margin-bottom: calc(var(--u)*1); }
  .hero-progress{ width: calc(var(--u)*26); height: calc(var(--u)*0.35); background: rgba(255,255,255,.18); border-radius: 4px; overflow:hidden; margin-bottom: calc(var(--u)*1.4); }
  .hero-progress > i{ display:block; height:100%; width:42%; background: var(--gold); }
  .hero-actions{ gap: calc(var(--u)*1); }
  .cta-btn{
    font-family:inherit; font-size: calc(var(--u)*1.1); font-weight:600;
    padding: calc(var(--u)*0.85) calc(var(--u)*1.8);
    border-radius: calc(var(--u)*0.9);
    border:none; cursor:pointer;
    display:flex; align-items:center; gap: calc(var(--u)*0.5);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta-btn.primary{ background: var(--gold); color:#1a1300; }
  .cta-btn.secondary{ background: rgba(255,255,255,.12); color: var(--text-1); }
  .cta-btn:focus{ transform: scale(1.09); box-shadow: 0 0 0 calc(var(--u)*0.18) var(--focus-ring); }

  .shelf{ padding: calc(var(--u)*2) 0 0; }
  .shelf-title{ font-size: calc(var(--u)*1.5); font-weight:700; margin: 0 0 calc(var(--u)*1.1) calc(var(--u)*4.2); }
  .shelf-track{
    display:flex; gap: calc(var(--u)*1.3);
    padding: calc(var(--u)*0.6) calc(var(--u)*4.2);
    overflow-x:visible;
  }
  .card{
    background:none; border:none; padding:0; color:inherit; text-align:left; cursor:pointer;
    flex: 0 0 calc(var(--u)*19);
    transition: transform .25s cubic-bezier(.2,.9,.3,1);
  }
  .card-art{
    position:relative;
    width:100%; aspect-ratio: 16/9;
    border-radius: calc(var(--u)*0.7);
    overflow:hidden;
    box-shadow: 0 calc(var(--u)*0.3) calc(var(--u)*1) rgba(0,0,0,.5);
  }
  .card-badge{
    position:absolute; top: calc(var(--u)*0.5); left: calc(var(--u)*0.5);
    font-size: calc(var(--u)*0.68); font-weight:700; letter-spacing:.03em;
    background: rgba(0,0,0,.55); padding: calc(var(--u)*0.15) calc(var(--u)*0.5);
    border-radius: calc(var(--u)*0.3);
    color: var(--text-1);
  }
  .card-play{
    position:absolute; right: calc(var(--u)*0.55); bottom: calc(var(--u)*0.55);
    width: calc(var(--u)*1.9); height: calc(var(--u)*1.9); border-radius:50%;
    background: var(--gold); color:#1a1300;
    display:flex; align-items:center; justify-content:center; font-size: calc(var(--u)*0.9);
  }
  .card-progress{ position:absolute; left:0; right:0; bottom:0; height: calc(var(--u)*0.22); background: rgba(0,0,0,.4); }
  .card-progress > i{ display:block; height:100%; background: var(--gold); }
  .card-title{ margin: calc(var(--u)*0.7) 0 calc(var(--u)*0.15); font-size: calc(var(--u)*1.05); font-weight:600; }
  .card-sub{ font-size: calc(var(--u)*0.82); color: var(--text-2); }
  .card:focus .card-art{ box-shadow: 0 0 0 calc(var(--u)*0.2) var(--focus-ring), 0 calc(var(--u)*1) calc(var(--u)*2) rgba(0,0,0,.65); }
  .card:focus{ transform: scale(1.1) translateY(calc(var(--u)*-0.2)); z-index:2; }

  .art-a{ background: linear-gradient(135deg,#2b3a67,#0f1526); }
  .art-b{ background: linear-gradient(135deg,#5a3a12,#1a1108); }
  .art-c{ background: linear-gradient(135deg,#3a1f3f,#140a17); }
  .art-d{ background: linear-gradient(135deg,#12403a,#081613); }
  .art-e{ background: linear-gradient(135deg,#4a1f22,#160a0b); }
  .art-f{ background: linear-gradient(135deg,#243a12,#0c1408); }

  @media (max-width: 640px){
    .hero-title{ max-width:80%; }
    .profile-row{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="tv-frame">
    <div class="tv-screen" id="tv">

      <!-- ===================== PROFILE SWITCHER ===================== -->
      <section class="screen screen-profiles is-active" id="screen-profiles">
        <p class="profiles-eyebrow">4 profiles on this server · Signed in as rkm</p>
        <h1 class="profiles-title">Who's watching?</h1>

        <div class="focus-row profile-row">
          <button class="profile-tile focusable" data-select-home>
            <span class="avatar">ME<span class="lock">🔒</span></span>
            <span class="name">meenu</span>
            <span class="sub">Profile · password</span>
          </button>
          <button class="profile-tile focusable" data-select-home>
            <span class="avatar">RA<span class="lock">🔒</span></span>
            <span class="name">raj</span>
            <span class="sub">Profile · password</span>
          </button>
          <button class="profile-tile focusable" data-select-home>
            <span class="avatar">RK<span class="lock">🔒</span></span>
            <span class="name">rkm</span>
            <span class="sub">Administrator · password</span>
          </button>
          <button class="profile-tile focusable" data-select-home>
            <span class="avatar">SH</span>
            <span class="name">sharanya</span>
            <span class="sub">Profile</span>
          </button>
          <button class="profile-tile add focusable">
            <span class="avatar">+</span>
            <span class="name">Add profile</span>
            <span class="sub">&nbsp;</span>
          </button>
        </div>

        <div class="focus-row profiles-actions">
          <button class="pill-btn focusable">Manage profiles</button>
          <button class="pill-btn focusable">Sign out</button>

      <!-- ===================== HOME ===================== -->
      <section class="screen screen-home" id="screen-home">
        <header class="tv-topbar">
          <div class="brand">RKM<span class="dot">·</span>CINEMA</div>
          <nav class="focus-row nav-tabs" id="nav-row">
            <button class="nav-tab focusable" aria-current="true">Home</button>
            <button class="nav-tab focusable">Movies Kids</button>
            <button class="nav-tab focusable">Movies</button>
            <button class="nav-tab focusable">TV Shows</button>
            <button class="nav-tab focusable">Watchlist</button>
            <button class="nav-tab focusable">Discover</button>
            <button class="nav-tab focusable">Suggest</button>
            <span style="flex:1"></span>
            <button class="icon-btn focusable" title="Search">🔍</button>
            <button class="icon-btn avatar-btn focusable" title="Switch profile" data-select-profiles>RK</button>
          </nav>
        </header>

        <div class="tv-content">
          <div class="tv-scroll">
            <div class="hero">
              <div class="hero-eyebrow">CONTINUE WATCHING</div>
              <h2 class="hero-title">Midnight Transit</h2>
              <div class="hero-meta">Series · Thriller · 2024 &nbsp;·&nbsp; 42% · 38m left</div>
              <div class="hero-progress"><i></i></div>
              <div class="focus-row hero-actions">
                <button class="cta-btn primary focusable">▶ Resume</button>
                <button class="cta-btn secondary focusable">Details</button>

            <section class="shelf">

              <div class="focus-row shelf-track">
                <button class="card focusable">

                  <div class="card-title">Midnight Transit</div><div class="card-sub">Overnight — 41m left</div>
                </button>
                <button class="card focusable">
                  <div class="card-art art-b"><span class="card-badge">S1·E9</span><span class="card-play">▶</span><div class="card-progress"><i style="width:18%"></i></div></div>
                  <div class="card-title">Coastal Static</div><div class="card-sub">Low Tide — 52m left</div>
                </button>
                <button class="card focusable">
                  <div class="card-art art-c"><span class="card-badge">MOVIE</span><span class="card-play">▶</span></div>
                  <div class="card-title">Glasswing</div><div class="card-sub">2025 · 1h 48m</div>
                </button>
                <button class="card focusable">
                  <div class="card-art art-d"><span class="card-badge">S1·E1</span><span class="card-play">▶</span><div class="card-progress"><i style="width:6%"></i></div></div>
                  <div class="card-title">Paper Moons</div><div class="card-sub">Pilot — 6% watched</div>
                </button>
              </div>
            </section>

            <section class="shelf">
              <h3 class="shelf-title">Recently Played</h3>
              <div class="focus-row shelf-track">
                <button class="card focusable">
                  <div class="card-art art-e"><span class="card-badge">S1·E3</span><span class="card-play">▶</span></div>
                  <div class="card-title">Harbor Lights</div><div class="card-sub">First Frost</div>
                </button>

                </button>

                  <div class="card-art art-b"><span class="card-badge">S2·E1</span><span class="card-play">▶</span></div>

            <section class="shelf">
              <h3 class="shelf-title">Recently Added</h3>
              <div class="focus-row shelf-track">
                <button class="card focusable">
                  <div class="card-art art-c"><span class="card-badge">MOVIE</span><span class="card-play">▶</span></div>
                  <div class="card-title">Ashen Court</div><div class="card-sub">2026 · 1h 55m</div>
                </button>
                <button class="card focusable">
                  <div class="card-art art-d"><span class="card-badge">S1·E5</span><span class="card-play">▶</span></div>
                  <div class="card-title">Violet Hour</div><div class="card-sub">Static Bloom</div>
                </button>
                <button class="card focusable">
                  <div class="card-art art-e"><span class="card-badge">MOVIE</span><span class="card-play">▶</span></div>
                  <div class="card-title">The Quiet Machine</div><div class="card-sub">2025 · 1h 37m</div>
                </button>
                <button class="card focusable">
                  <div class="card-art art-f"><span class="card-badge">S1·E2</span><span class="card-play">▶</span></div>

          </div>

    </div>
  </div>
  <p class="hint">Navigate like a Siri Remote — <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> to move focus, <kbd>Enter</kbd> to select. Click also works.</p>
</div>

<script>
(function(){
  const tv = document.getElementById('tv');
  const screens = { profiles: document.getElementById('screen-profiles'), home: document.getElementById('screen-home') };
  const topbar = document.querySelector('.tv-topbar');
  const navRow = document.getElementById('nav-row');

  function activeScreen(){ return tv.querySelector('.screen.is-active'); }

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('is-active'));
    screens[name].classList.add('is-active');
    const first = screens[name].querySelector('.focusable');
    if(first) first.focus();
  }

  tv.querySelectorAll('[data-select-home]').forEach(el => el.addEventListener('click', () => showScreen('home')));
  tv.querySelectorAll('[data-select-profiles]').forEach(el => el.addEventListener('click', () => showScreen('profiles')));

  // Dim the top bar when focus moves away from it (mirrors tvOS top-bar recede-on-scroll behavior)
  document.addEventListener('focusin', (e) => {
    if(!topbar) return;
    const inTopbar = navRow.contains(e.target);
    topbar.classList.toggle('dimmed', !inTopbar);
    // keep focused shelf card scrolled into view
    if(e.target.closest('.shelf-track')){
      e.target.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
    }
    if(e.target.closest('.tv-scroll')){
      e.target.scrollIntoView({ block:'nearest', behavior:'smooth' });
    }
  });

  function rowsOf(screen){ return Array.from(screen.querySelectorAll('.focus-row')); }
  function itemsOf(row){ return Array.from(row.querySelectorAll('.focusable')); }

  document.addEventListener('keydown', (e) => {
    const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '];
    if(!keys.includes(e.key)) return;
    const current = document.activeElement;
    if(!current || !current.classList || !current.classList.contains('focusable')) return;
    e.preventDefault();

    if(e.key === 'Enter' || e.key === ' '){ current.click(); return; }

    const screen = activeScreen();
    const row = current.closest('.focus-row');
    if(!row) return;
    const items = itemsOf(row);
    const idx = items.indexOf(current);

    if(e.key === 'ArrowLeft' && idx > 0){ items[idx-1].focus(); return; }
    if(e.key === 'ArrowRight' && idx < items.length-1){ items[idx+1].focus(); return; }

    if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      const rows = rowsOf(screen);
      const rIdx = rows.indexOf(row);
      const targetIdx = e.key === 'ArrowUp' ? rIdx - 1 : rIdx + 1;
      if(targetIdx < 0 || targetIdx >= rows.length) return;
      const targetItems = itemsOf(rows[targetIdx]);
      if(!targetItems.length) return;
      const curX = current.getBoundingClientRect();
      let best = targetItems[0], bestDist = Infinity;
      targetItems.forEach(it => {
        const r = it.getBoundingClientRect();
        const d = Math.abs((r.left + r.width/2) - (curX.left + curX.width/2));
        if(d < bestDist){ bestDist = d; best = it; }
      });
      best.focus();
    }
  });

  // initial focus
  window.addEventListener('load', () => {
    const first = activeScreen().querySelector('.focusable');
    if(first) first.focus();
  });
})();
</script>
</body>
</html>
